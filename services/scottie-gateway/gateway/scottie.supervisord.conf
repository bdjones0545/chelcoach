[program:scottie-gateway]
command=/bin/bash /root/.hermes/profiles/scottie/scripts/run_scottie_gateway.sh
directory=/root/.hermes/profiles/scottie
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/scottie/gateway.out.log
stderr_logfile=/var/log/scottie/gateway.err.log
; SCOTTIE_PROVIDER is deliberately NOT set here: the profile .env is the single source of truth
; (run_scottie_gateway.sh sources it, then applies "fake" only if nothing set it).
environment=HERMES_SCOTTIE_HOME="/root/.hermes/profiles/scottie",HOME="/root",PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin",SCOTTIE_API_HOST="127.0.0.1",SCOTTIE_API_PORT="2340"
user=root
priority=110

[program:scottie-tunnel]
command=/bin/bash /root/.hermes/profiles/scottie/scripts/run_scottie_tunnel.sh
directory=/root/.hermes/profiles/scottie
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/scottie/tunnel.out.log
stderr_logfile=/var/log/scottie/tunnel.err.log
environment=HOME="/root",PATH="/usr/local/bin:/usr/bin:/bin",SCOTTIE_CLOUDFLARED_METRICS="127.0.0.1:20245"
user=root
priority=210
