name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Object storage, ffmpeg, and AI keys are not required for CI.
# Postgres is used for Step 6 durable job repository integration tests.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chelcoach
          POSTGRES_PASSWORD: chelcoach
          POSTGRES_DB: chelcoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chelcoach -d chelcoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chelcoach:chelcoach@localhost:5432/chelcoach_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            shared/package-lock.json

      # Shared contract first — the frontend build and server typecheck resolve its types.
      - name: Install shared contract
        working-directory: shared
        run: npm ci

      - name: Test shared Scotty contracts
        working-directory: shared
        run: npm test

      # Frontend: install + type-check + production build.
      - name: Install frontend
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Backend: install + type-check + tests + smoke (memory) + Postgres job repo.
      - name: Install server
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Apply Drizzle schema to CI Postgres
        working-directory: server
        run: npx drizzle-kit push

      - name: Test server (in-memory adapters)
        working-directory: server
        env:
          CHELCOACH_FORCE_MEMORY_REPOS: "1"
          DATABASE_URL: ""
        run: npm test

      - name: Test durable job repository against Postgres
        working-directory: server
        env:
          CHELCOACH_RUN_PG_TESTS: "1"
          DATABASE_URL: postgresql://chelcoach:chelcoach@localhost:5432/chelcoach_test
        run: npm run test:pg

      - name: Smoke test server
        working-directory: server
        env:
          CHELCOACH_FORCE_MEMORY_REPOS: "1"
          DATABASE_URL: ""
        run: npm run smoke
