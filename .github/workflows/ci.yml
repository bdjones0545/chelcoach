name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No Postgres, object storage, or AI keys are required for CI.
# FFmpeg is installed for Phase-3 extraction unit/integration/smoke coverage.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            shared/package-lock.json

      # Shared contract first — the frontend build and server typecheck resolve its types.
      - name: Install shared contract
        working-directory: shared
        run: npm ci

      # Frontend: install + type-check + production build.
      - name: Install frontend
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      # Backend: install + type-check + unit/integration tests + smoke (in-memory storage).
      - name: Install server
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Test server
        working-directory: server
        run: npm test

      - name: Smoke test server
        working-directory: server
        run: npm run smoke
