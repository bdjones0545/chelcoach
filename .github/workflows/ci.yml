name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Object storage, ffmpeg, and AI keys are not required for CI.
# Postgres is used for Step 6 durable job repository integration tests and Step 9 E2E.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chelcoach
          POSTGRES_PASSWORD: chelcoach
          POSTGRES_DB: chelcoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chelcoach -d chelcoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chelcoach:chelcoach@localhost:5432/chelcoach_test
      CHELCOACH_RECONCILE_SECRET: e2e-reconcile-secret
      CHELCOACH_E2E_SECRET: e2e-secret
      CHELCOACH_E2E_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            shared/package-lock.json

      # Shared contract first — the frontend build and server typecheck resolve its types.
      - name: Install shared contract
        working-directory: shared
        run: npm ci

      - name: Test shared Scotty contracts
        working-directory: shared
        run: npm test

      # Frontend: install + type-check + production build.
      - name: Install frontend
        run: npm ci

      - name: Test frontend (Vitest)
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # Backend: install + type-check + tests + smoke (memory) + Postgres job repo.
      - name: Install server
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      # Build the CI database with the SAME committed migrations production applies. Using
      # `drizzle-kit push` here diffed schema.ts straight into Postgres, so every test below
      # validated a schema production never builds, and a model shipped without its migration
      # passed CI and failed on deploy. This step is also the fail-fast gate: a broken or
      # mis-ordered migration terminates the job before test:pg is treated as authoritative.
      - name: Apply production migrations to CI Postgres
        working-directory: server
        run: npm run db:migrate

      # Table-level parity between schema.ts and the committed SQL, journal integrity, and an
      # idempotent second migration pass against the real database.
      - name: Verify migration parity
        working-directory: server
        run: npm run test:migration-parity

      # CHELCOACH_E2E_MODE is set job-wide for the Playwright step, but it leaks into this one:
      # it installs the E2E fake media inspector, which rejects these tests' fixtures and fails 16
      # of them. Scope it off here — the unit suite must exercise the real wiring, not E2E hooks.
      - name: Test server (in-memory adapters)
        working-directory: server
        env:
          CHELCOACH_FORCE_MEMORY_REPOS: "1"
          DATABASE_URL: ""
          CHELCOACH_E2E_MODE: "0"
        run: npm test

      - name: Test durable job repository against Postgres
        working-directory: server
        env:
          CHELCOACH_RUN_PG_TESTS: "1"
          DATABASE_URL: postgresql://chelcoach:chelcoach@localhost:5432/chelcoach_test
        run: npm run test:pg

      - name: Smoke test server
        working-directory: server
        env:
          CHELCOACH_FORCE_MEMORY_REPOS: "1"
          DATABASE_URL: ""
        run: npm run smoke

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Point Playwright at the SAME migration-built database the steps above proved. Previously
      # the API was forced onto in-memory repositories with a blanked DATABASE_URL while the E2E
      # helpers queried Postgres, so durable assertions read zero rows from a database the API had
      # never written to. No drizzle-kit push, no second schema — this is the migrated database.
      - name: E2E browser verification (Chromium full)
        run: npx playwright test --project=chromium
        env:
          CI: "1"
          DATABASE_URL: postgresql://chelcoach:chelcoach@localhost:5432/chelcoach_test
          CHELCOACH_E2E_DATABASE_URL: postgresql://chelcoach:chelcoach@localhost:5432/chelcoach_test
          CHELCOACH_FORCE_MEMORY_REPOS: "0"
          CHELCOACH_RECONCILE_SECRET: e2e-reconcile-secret
          CHELCOACH_E2E_SECRET: e2e-secret

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
